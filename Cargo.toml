[package]
name = "flash-store"
version = "0.1.0"
edition = "2021"
authors = ["Zein <zeindergham@gmail.com>"]
description = "An Embedded Thread-Safe LSM-Tree Key-Value Storage Engine in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeindergham/flash-store"

[dependencies]
bytes = { version = "1.5", features = ["serde"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
crc32fast = "1.3"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
rand = "0.8"
criterion = "0.5"

[lib]
path = "src/lib.rs"

[[bin]]
name = "flash-cli"
path = "src/bin/flash_cli.rs"

[[bench]]
name = "benchmarks"
path = "benches/benchmarks.rs"
harness = false
